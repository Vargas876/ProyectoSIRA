#spring.application.name=casos-especiales
spring.application.name=casos-especiales-sira
server.port=8080

# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sira_casos_especiales?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# JPA / HIBERNATE
# ============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================================
# LOGGING
# ============================================================================
logging.level.root=INFO
logging.level.com.uptc.sira.casosespeciales=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
jwt.secret=u8F3kL9qP1sA7xZ0mR4bT2vC6nW8yQ5hE3dJ1kL0pB9sT7rU
jwt.expiration=86400000

# ============================================================================
# UPLOAD FILES
# ============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# CORS
# ============================================================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000
