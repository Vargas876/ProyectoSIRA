      <path d="M 365 220 C 320 210 275 205 230 215 L 210 220 L 215 230 L 240 222"/>
      <path d="M 365 230 C 310 220 255 215 200 230 L 180 235 L 185 245 L 215 234"/>
      <path d="M 365 240 C 300 230 235 225 170 245 L 150 250 L 155 260 L 190 246"/>
      <path d="M 365 250 C 290 240 215 235 140 260 L 120 265 L 125 275 L 165 258"/>
      <path d="M 365 260 C 280 250 195 245 110 275 L 90 280 L 95 290 L 140 270"/>
    </g>

    <!-- Right Wing -->
    <g>
      <path d="M 435 200 C 460 190 485 185 510 185 L 530 190 L 525 200 L 510 198"/>
      <path d="M 435 210 C 470 200 505 195 540 200 L 560 205 L 555 215 L 535 210"/>
      <path d="M 435 220 C 480 210 525 205 570 215 L 590 220 L 585 230 L 560 222"/>
      <path d="M 435 230 C 490 220 545 215 600 230 L 620 235 L 615 245 L 585 234"/>
      <path d="M 435 240 C 500 230 565 225 630 245 L 650 250 L 645 260 L 610 246"/>
      <path d="M 435 250 C 510 240 585 235 660 260 L 680 265 L 675 275 L 635 258"/>
      <path d="M 435 260 C 520 250 605 245 690 275 L 710 280 L 705 290 L 660 270"/>
    </g>

    <!-- Lower Body/Tail -->
    <path d="M 390 315 L 375 400 L 380 420 L 400 410 L 420 420 L 425 400 L 410 315 Z"/>

    <!-- Legs -->
    <path d="M 375 400 L 360 450 L 350 455 L 340 465 M 350 455 L 365 465 M 350 455 L 345 470"/>
    <path d="M 425 400 L 440 450 L 450 455 L 460 465 M 450 455 L 435 465 M 450 455 L 455 470"/>
  </g>

  <!-- Golden Wing Bands -->
  <g fill="#D4AF37">
    <ellipse cx="340" cy="230" rx="15" ry="40" transform="rotate(-20 340 230)"/>
    <ellipse cx="460" cy="230" rx="15" ry="40" transform="rotate(20 460 230)"/>
  </g>

  <!-- Shield -->
  <g>
    <!-- Shield Outline -->
    <path d="M 400 480 L 340 500 L 340 550 L 400 590 L 460 550 L 460 500 Z" fill="none" stroke="#000000" stroke-width="3"/>

    <!-- Inner Shield -->
    <path d="M 400 490 L 350 505 L 350 545 L 400 580 L 450 545 L 450 505 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- Golden Triangle -->
