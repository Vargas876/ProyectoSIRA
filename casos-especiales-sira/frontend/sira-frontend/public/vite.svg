    <!-- Inner Lines on Triangle -->
    <path d="M 400 520 L 400 555" stroke="#000000" stroke-width="1.5"/>
    <path d="M 385 540 L 415 540" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- Diamond below shield -->
  <path d="M 400 595 L 390 605 L 400 615 L 410 605 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Text: FATIVRVM -->
  <path d="M 150 680 Q 150 650 180 650 L 220 650" stroke="#000000" stroke-width="2" fill="none"/>
  <text x="160" y="680" font-family="serif" font-size="48" fill="#000000" font-weight="bold">FATIVRVM</text>

  <!-- Text: AEDIFICAMVS -->
  <path d="M 580 680 Q 650 650 650 680" stroke="#000000" stroke-width="2" fill="none"/>
  <text x="465" y="780" font-family="serif" font-size="48" fill="#000000" font-weight="bold">AEDIFICAMVS</text>
</svg>